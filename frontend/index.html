<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitelog</title>
  <meta name="description" content="Log what you eat by chatting. Calories and macros at a glance.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitelog">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <h1 class="title">Bitelog</h1>
    <p class="muted">Enter your password to open your food log.</p>
    <form id="login-form" class="login-form">
      <label for="password" class="sr-only">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="primary">Log in</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" class="app" hidden>
    <header class="top">
      <h1 class="title">Bitelog</h1>
      <button id="goals-button" class="icon-button" aria-label="Edit daily goals" title="Edit daily goals">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </header>

    <div class="day-row">
      <button id="day-button" class="day-button" aria-haspopup="dialog" aria-label="Choose a day">
        <span id="day-label">Today</span>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
      <button id="back-today" class="pill" hidden>Back to today</button>
    </div>

    <section class="charts card" aria-label="Totals for the chosen day">
      <figure class="chart kcal">
        <div class="chart-box">
          <canvas id="kcal-chart" aria-hidden="true"></canvas>
          <div class="ring-center">
            <span id="kcal-eaten" class="big">0</span>
            <span id="kcal-goal" class="muted">of 2,200 kcal</span>
          </div>
        </div>
        <figcaption id="kcal-left">2,200 kcal left</figcaption>
      </figure>

      <figure class="chart macros">
        <div class="chart-box">
          <canvas id="macro-chart" aria-hidden="true"></canvas>
        </div>
        <figcaption>
          <ul class="legend">
            <li><span class="dot protein"></span>Protein <b id="p-pct">0%</b> <span id="p-g" class="muted">0g</span></li>
            <li><span class="dot carbs"></span>Carbs <b id="c-pct">0%</b> <span id="c-g" class="muted">0g</span></li>
            <li><span class="dot fat"></span>Fat <b id="f-pct">0%</b> <span id="f-g" class="muted">0g</span></li>
          </ul>
        </figcaption>
      </figure>
    </section>

    <section id="chat-log" class="chat-log" aria-live="polite" aria-label="Chat"></section>

    <form id="chat-form" class="composer">
      <label for="chat-input" class="sr-only">What did you eat?</label>
      <input id="chat-input" type="text" autocomplete="off" maxlength="1000" placeholder="What did you eat?" required>
      <button id="send-button" type="submit" class="primary">Send</button>
    </form>
  </div>

  <!-- Day picker -->
  <dialog id="day-dialog" class="sheet" aria-labelledby="day-dialog-title">
    <h2 id="day-dialog-title" class="sr-only">Choose a day</h2>
    <div class="pills">
      <button type="button" class="pill" data-quick="0">Today</button>
      <button type="button" class="pill" data-quick="-1">Yesterday</button>
    </div>
    <div class="month-head">
      <button type="button" id="prev-month" class="icon-button" aria-label="Previous month">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15 6l-6 6 6 6z"/></svg>
      </button>
      <span id="month-title" class="month-title"></span>
      <button type="button" id="next-month" class="icon-button" aria-label="Next month">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M9 6l6 6-6 6z"/></svg>
      </button>
    </div>
    <div class="weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div id="month-grid" class="month-grid"></div>
    <div class="dialog-actions">
      <button type="button" id="day-cancel" class="ghost">Close</button>
    </div>
  </dialog>

  <!-- Goals -->
  <dialog id="goals-dialog" class="sheet goals">
    <form id="goals-form" method="dialog">
      <h2>Daily goals</h2>
      <label>Calories <span class="unit">kcal</span><input name="kcal" type="number" min="500" max="10000" step="1" required></label>
      <label>Protein <span class="unit">g</span><input name="protein" type="number" min="0" max="1000" step="1" required></label>
      <label>Carbs <span class="unit">g</span><input name="carbs" type="number" min="0" max="1000" step="1" required></label>
      <label>Fat <span class="unit">g</span><input name="fat" type="number" min="0" max="1000" step="1" required></label>
      <p id="goals-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="goals-cancel" class="ghost">Cancel</button>
        <button type="submit" id="goals-save" class="primary">Save goals</button>
      </div>
    </form>
  </dialog>
</body>
</html>
